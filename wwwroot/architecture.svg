<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1032" viewBox="0 0 1600 1032" role="img" aria-labelledby="title desc"><title id="title">C03 UML sequence workflow</title><desc id="desc">1. Configure inputs and press Run 2. POST application API endpoint 3. Create session with capability overrides 4. Retrieve the stored base agent 5. Open event stream BEFORE sending 6. Send user.message; observe events 7. Answer, stop reason and recorded history 8. JSON or NDJSON evidence to browser 9. Inspect result and boundary conditions</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087fff"/></marker></defs><rect width="100%" height="100%" rx="22" fill="#fff"/><text x="40" y="50" font-family="Arial" font-weight="700" font-size="30" fill="#090d3b">C03 · Session Configuration and History</text><rect x="12" y="88" width="276" height="66" rx="14" fill="#087fff"/><text x="150" y="130" text-anchor="middle" fill="white" font-size="25" font-family="Arial" font-weight="700">Student</text><path d="M150 154 V967" stroke="#b1c9e4" stroke-dasharray="6 6"/><rect x="332" y="88" width="276" height="66" rx="14" fill="#8838ff"/><text x="470" y="130" text-anchor="middle" fill="white" font-size="25" font-family="Arial" font-weight="700">Browser UI</text><path d="M470 154 V967" stroke="#b1c9e4" stroke-dasharray="6 6"/><rect x="652" y="88" width="276" height="66" rx="14" fill="#00a977"/><text x="790" y="130" text-anchor="middle" fill="white" font-size="25" font-family="Arial" font-weight="700">Blazor host</text><path d="M790 154 V967" stroke="#b1c9e4" stroke-dasharray="6 6"/><rect x="972" y="88" width="276" height="66" rx="14" fill="#087fff"/><text x="1110" y="130" text-anchor="middle" fill="white" font-size="25" font-family="Arial" font-weight="700">SDK / workflow</text><path d="M1110 154 V967" stroke="#b1c9e4" stroke-dasharray="6 6"/><rect x="1292" y="88" width="276" height="66" rx="14" fill="#8838ff"/><text x="1430" y="130" text-anchor="middle" fill="white" font-size="25" font-family="Arial" font-weight="700">Managed Agents</text><path d="M1430 154 V967" stroke="#b1c9e4" stroke-dasharray="6 6"/><path d="M150 210 H470" stroke="#087fff" stroke-width="2" marker-end="url(#arrow)"/><text x="162" y="197" font-family="Arial" font-size="21" fill="#142d53">1. Configure inputs and press Run</text><path d="M470 298 H790" stroke="#087fff" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="285" font-family="Arial" font-size="21" fill="#142d53">2. POST application API endpoint</text><path d="M790 386 H1430" stroke="#087fff" stroke-width="2" marker-end="url(#arrow)"/><text x="802" y="373" font-family="Arial" font-size="21" fill="#142d53">3. Create session with capability overrides</text><path d="M790 474 H1430" stroke="#087fff" stroke-width="2" marker-end="url(#arrow)"/><text x="802" y="461" font-family="Arial" font-size="21" fill="#142d53">4. Retrieve the stored base agent</text><path d="M790 562 H1430" stroke="#087fff" stroke-width="2" marker-end="url(#arrow)"/><text x="802" y="549" font-family="Arial" font-size="21" fill="#142d53">5. Open event stream BEFORE sending</text><path d="M790 650 H1430" stroke="#087fff" stroke-width="2" marker-end="url(#arrow)"/><text x="802" y="637" font-family="Arial" font-size="21" fill="#142d53">6. Send user.message; observe events</text><path d="M1430 738 H790" stroke="#087fff" stroke-width="2" marker-end="url(#arrow)"/><text x="802" y="725" font-family="Arial" font-size="21" fill="#142d53">7. Answer, stop reason and recorded history</text><path d="M790 826 H470" stroke="#087fff" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="813" font-family="Arial" font-size="21" fill="#142d53">8. JSON or NDJSON evidence to browser</text><path d="M470 914 H150" stroke="#087fff" stroke-width="2" marker-end="url(#arrow)"/><text x="162" y="901" font-family="Arial" font-size="21" fill="#142d53">9. Inspect result and boundary conditions</text><text x="40" y="1010" fill="#276746" font-size="21" font-family="Arial">LIVE: configuration → provider workflow → observable evidence. See the source walkthrough for exact boundaries.</text></svg>